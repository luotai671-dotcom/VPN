name: IndexNow Auto Submit

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit sitemap URLs to IndexNow
        run: node scripts/push-indexnow.cjs
