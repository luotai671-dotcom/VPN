# 2. 泛匹配 /go/ 与 /go.html 承接页防爬虫标记
location ^~ /go/ {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    rewrite ^/go/(.*)$ /go.html?id=$1 redirect;
}

location = /go.html {
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}
