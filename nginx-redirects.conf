# ==============================================================================
# Nginx 302 Redirect Rules for Affiliate Links (AFF 302 隔离与合规配置)
# 使用指南：
# 1. 将此文件上传至您的 VPS / 宝塔面板站点目录
# 2. 在站点配置文件 server { ... } 区块中引入：
#    include /www/wwwroot/your-site/nginx-redirects.conf;
# ==============================================================================

# 1. 11 款核心服务商独立 302 高速直出
